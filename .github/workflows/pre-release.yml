name: pre-release

on:
  push:
    branches: [develop]
  workflow_dispatch:
    inputs:
      version:
        description: 'Explicit version to release, e.g. 1.2.0 (overrides auto bump)'
        required: false
        type: string
      bump:
        description: 'Force a bump type instead of inferring from commits'
        required: false
        type: choice
        options: [auto, patch, minor, major]
        default: auto

jobs:
  test:
    uses: ./.github/workflows/tests.yml

  pre-release:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Compute next version
        id: version
        run: |
          NEXT=$(.github/scripts/next-version.sh "${{ inputs.bump || 'auto' }}" "${{ inputs.version || '' }}")
          if [[ "$NEXT" == "NONE" ]]; then
            echo "Nothing to release: no commits since the last stable tag."
            echo "skip=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "skip=false" >> "$GITHUB_OUTPUT"
          echo "version=$NEXT" >> "$GITHUB_OUTPUT"

      - name: Determine next RC number
        id: rc
        if: steps.version.outputs.skip != 'true'
        run: |
          LAST_RC=$(git tag --list "v${{ steps.version.outputs.version }}-rc.*" | sort -V | tail -1)
          if [[ -z "$LAST_RC" ]]; then
            N=1
          else
            N=$(( ${LAST_RC##*.} + 1 ))
          fi
          echo "tag=v${{ steps.version.outputs.version }}-rc.${N}" >> "$GITHUB_OUTPUT"

      - name: Tag and publish pre-release
        if: steps.version.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git tag "${{ steps.rc.outputs.tag }}"
          git push origin "${{ steps.rc.outputs.tag }}"
          gh release create "${{ steps.rc.outputs.tag }}" \
            --prerelease \
            --generate-notes \
            --target "${{ github.sha }}" \
            --title "${{ steps.rc.outputs.tag }}"
