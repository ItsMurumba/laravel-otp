name: release

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      version:
        description: 'Explicit version to release, e.g. 1.2.0 (overrides auto bump)'
        required: false
        type: string
      bump:
        description: 'Force a bump type instead of inferring from commits'
        required: false
        type: choice
        options: [auto, patch, minor, major]
        default: auto

jobs:
  test:
    uses: ./.github/workflows/tests.yml

  release:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Determine version to release
        id: version
        run: |
          # Default path: promote the newest RC reachable from this commit.
          LAST_RC=$(git tag --list 'v*-rc.*' --merged HEAD | sort -V | tail -1)
          if [[ -n "$LAST_RC" && -z "${{ inputs.version }}" && "${{ inputs.bump || 'auto' }}" == "auto" ]]; then
            CANDIDATE="${LAST_RC%-rc.*}"
            CANDIDATE="${CANDIDATE#v}"
          else
            CANDIDATE=$(.github/scripts/next-version.sh "${{ inputs.bump || 'auto' }}" "${{ inputs.version || '' }}")
          fi

          if [[ "$CANDIDATE" == "NONE" ]]; then
            echo "Nothing to release: no commits since the last stable tag."
            echo "skip=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if git rev-parse "v${CANDIDATE}" >/dev/null 2>&1; then
            echo "v${CANDIDATE} already exists, nothing new to release."
            echo "skip=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "skip=false" >> "$GITHUB_OUTPUT"
          echo "version=$CANDIDATE" >> "$GITHUB_OUTPUT"

      - name: Tag and publish release
        if: steps.version.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="v${{ steps.version.outputs.version }}"
          git tag "$TAG"
          git push origin "$TAG"
          gh release create "$TAG" \
            --generate-notes \
            --target "${{ github.sha }}" \
            --title "$TAG"

      - name: Notify Packagist
        if: steps.version.outputs.skip != 'true'
        continue-on-error: true
        run: |
          if [[ -z "${{ secrets.PACKAGIST_API_TOKEN }}" || -z "${{ secrets.PACKAGIST_USERNAME }}" ]]; then
            echo "::warning::PACKAGIST_USERNAME/PACKAGIST_API_TOKEN not set — skipping Packagist notification. The tag and GitHub Release were still created."
            exit 0
          fi
          curl -sf -XPOST -H "content-type:application/json" \
            "https://packagist.org/api/update-package?username=${{ secrets.PACKAGIST_USERNAME }}&apiToken=${{ secrets.PACKAGIST_API_TOKEN }}" \
            -d '{"repository":{"url":"https://github.com/${{ github.repository }}"}}'
